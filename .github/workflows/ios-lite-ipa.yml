name: iOS Lite IPA
on:
  workflow_dispatch:
  push:
    branches: [feat/ios-lite-ipa]
    paths:
      - '.github/workflows/ios-lite-ipa.yml'
      - 'scripts/build/ios/**'
      - 'ios/**'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'Patches/**'
      - 'cmake/**'
      - 'GeneralsMD/Code/Main/SDL3Main.cpp'
      - 'Core/GameEngineDevice/Source/OpenALAudioDevice/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '9a5dfef5d1a0438a7d24856a85bd60f309d355e9'
      - name: Install build dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen glslang sdl3 ffmpeg freetype fontconfig autoconf autoconf-archive automake libtool
      - name: Install Vulkan SDK
        run: |
          curl -fL --retry 3 --max-time 300 'https://sdk.lunarg.com/sdk/download/1.4.341.1/mac/vulkansdk-macos-1.4.341.1.zip' -o /tmp/vulkan.zip
          echo '632cbe96c8ed6ed00c6ce25e3a7738c466134f76586e1c51f1419410d7f9042e  /tmp/vulkan.zip' | shasum -a 256 -c -
          mkdir -p /tmp/vulkan
          unzip -q /tmp/vulkan.zip -d /tmp/vulkan
          SDK_APP="$(find /tmp/vulkan -name 'vulkansdk-macOS-*.app' -type d -print -quit)"
          test -n "$SDK_APP"
          SDK_INSTALLER="$(find "$SDK_APP/Contents/MacOS" -name 'vulkansdk-macOS-*' -type f -print -quit)"
          test -n "$SDK_INSTALLER"
          "$SDK_INSTALLER" --root "$HOME/VulkanSDK/1.4.341.1" --accept-licenses --default-answer --confirm-command install copy_only=1
          SDK_ROOT="$HOME/VulkanSDK/1.4.341.1/macOS"
          test -f "$SDK_ROOT/include/vulkan/vulkan.h"
          echo "VULKAN_SDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/bin" >> "$GITHUB_PATH"
      - name: Prepare iOS frameworks
        run: |
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh
      - name: Build iOS engine
        run: |
          cmake --preset ios-vulkan
          cmake --build build/ios-vulkan --target z_generals --parallel 4
      - name: Assemble unsigned app
        run: |
          GX_UNSIGNED=1 GX_BUNDLE_ID=com.fares.generalszh ./scripts/build/ios/package-ios-zh.sh --dev
          bash scripts/build/ios/make-lite-ipa.sh
      - name: Validate unsigned IPA structure and iOS binaries
        run: |
          set -euo pipefail
          APP="build/ios-package/GeneralsXZH.app"
          IPA="build/GeneralsXZH-lite-unsigned.ipa"
          test -s "$IPA"
          unzip -tqq "$IPA"
          test -f "$APP/GeneralsXZH"
          test -f "$APP/Info.plist"
          test -f "$APP/Bootstrap/dxvk.conf"
          test -f "$APP/Bootstrap/DefaultOptions.ini"
          for font in arial.ttf arialbold.ttf couriernew.ttf timesnewroman.ttf; do
            test -f "$APP/Bootstrap/fonts/$font"
          done
          for lib in libdxvk_d3d8.0.dylib libdxvk_d3d9.0.dylib libSDL3.0.dylib libSDL3_image.0.dylib libopenal.1.dylib; do
            test -f "$APP/Frameworks/$lib"
          done
          test -f "$APP/Frameworks/MoltenVK.framework/MoltenVK"
          test ! -d "$APP/GameData"
          test ! -f "$APP/embedded.mobileprovision"
          xcrun lipo -verify_arch arm64 "$APP/GeneralsXZH"
          xcrun lipo -verify_arch arm64 "$APP/Frameworks/MoltenVK.framework/MoltenVK"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = "com.fares.generalszh"
          test "$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")" = "16.0"
          echo "IPA contents and architecture verified."
      - uses: actions/upload-artifact@v4
        with:
          name: GeneralsXZH-lite-unsigned-ipa
          path: build/GeneralsXZH-lite-unsigned.ipa
          if-no-files-found: error
